# Weekly SEO audit for a site built with seo-content-forge.
# Copy into the site repository as .github/workflows/seo-audit.yml and
# replace {{SITE_URL}} (and the toolkit checkout ref) for the site.
# The three checkers exit non-zero on failure, which fails the job and
# opens/updates a "SEO audit failing" issue - the site polices itself.

name: SEO Audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the toolkit
        uses: actions/checkout@v4
        with:
          repository: OWNER/seo-content-forge
          path: forge

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install the toolkit helpers
        working-directory: forge/scripts
        run: |
          uv venv
          uv pip install -e .

      - name: Agent readiness
        id: agent
        working-directory: forge/scripts
        continue-on-error: true
        run: uv run python check_agent_ready.py --url {{SITE_URL}} | tee agent.txt

      - name: PageSpeed / Core Web Vitals
        id: pagespeed
        working-directory: forge/scripts
        continue-on-error: true
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: uv run python check_pagespeed.py --url {{SITE_URL}} | tee pagespeed.txt

      - name: Rich results
        id: rich
        working-directory: forge/scripts
        continue-on-error: true
        run: uv run python check_rich_results.py --url {{SITE_URL}} | tee rich.txt

      - name: Open an issue when any suite failed
        if: steps.agent.outcome == 'failure' || steps.pagespeed.outcome == 'failure' || steps.rich.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const read = (name) => {
              try {
                return fs.readFileSync(`forge/scripts/${name}`, "utf8").slice(-3000);
              } catch {
                return "(no output)";
              }
            };
            const body = [
              "Automated weekly SEO audit failed for {{SITE_URL}}.",
              "",
              "## Agent readiness",
              "```", read("agent.txt"), "```",
              "## PageSpeed",
              "```", read("pagespeed.txt"), "```",
              "## Rich results",
              "```", read("rich.txt"), "```",
              "",
              "Run the test-site-readiness skill (or /seo-test) to fix and re-test.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "seo-audit",
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "SEO audit failing",
                labels: ["seo-audit"],
                body,
              });
            }

      - name: Fail the job when any suite failed
        if: steps.agent.outcome == 'failure' || steps.pagespeed.outcome == 'failure' || steps.rich.outcome == 'failure'
        run: exit 1
