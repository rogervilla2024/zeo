[project]
name = "seo-content-forge"
version = "0.1.0"
description = "Site-agnostic SEO helpers (sitemaps, JSON-LD, validation) for the seo-content-forge Claude Code toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["orjson>=3.10", "pillow>=10"]

[project.scripts]
scf-sitemap = "generate_sitemap:main"
scf-jsonld = "build_jsonld:main"
scf-validate = "validate_schema:main"

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[tool.setuptools]
py-modules = [
    "build_jsonld", "generate_sitemap", "validate_schema",
    "generate_llmstxt", "generate_og_image", "generate_favicons",
    "generate_theme_css", "suggest_internal_links", "check_agent_ready",
    "check_pagespeed", "check_rich_results", "check_ai_patterns",
    "check_originality", "check_js_budget", "export_toolkit", "find_theme",
]
packages = ["seo_content_forge"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
